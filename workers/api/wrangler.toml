# WaterLog API worker (Hono).
name = "waterlog-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "waterlog-db"
database_id = "8b96aa01-ac65-4e49-a0d0-abc785d60c43"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "waterlog-photos"

[[queues.producers]]
binding = "ENRICH_QUEUE"
queue = "waterlog-enrich"

[vars]
# Where the web app lives. Used for auth redirects, magic-link URLs, and the Google OAuth
# redirect_uri — so it must be the origin the *browser* uses, which is the Pages site that
# proxies /api/* here, never this Worker's own *.workers.dev host.
APP_URL = "https://waterlog-web.pages.dev"
# Auth secrets are placeholders here. In real environments set them with
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put RESEND_API_KEY
# etc. — never commit real values.
GOOGLE_CLIENT_ID = "893952815211-fa5p6mg1afqdee979rgdka5drm2bqgas.apps.googleusercontent.com"
#
# ALLOW_CONSOLE_MAIL deliberately does NOT appear in this file. It permits the ConsoleMailer,
# which prints the whole magic link — a bearer credential — to the log. Every environment that
# loads this file is a deployed one, so setting it here would reintroduce exactly the failure
# mode the fail-closed mailer exists to prevent. It belongs in `.dev.vars` (see
# `.dev.vars.example`) and in the test harness's miniflare bindings, nowhere else.
# Without it and without RESEND_API_KEY, POST /api/auth/magic-link answers 503 and mints no
# token — deployments must have the RESEND_API_KEY secret set.
