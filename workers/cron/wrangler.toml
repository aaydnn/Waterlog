# WaterLog cron worker — nightly pattern recompute (packet §08/§10).
#
# Both producer and consumer of the same queue: the scheduled trigger enqueues one job per angler,
# and the consumer below computes one angler per message. That is what gives each angler their own
# CPU budget and their own retries instead of one invocation walking every user.
name = "waterlog-cron"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[triggers]
# 08:00 UTC — overnight for the founder waters, and comfortably after the last evening trip has
# synced and enriched.
crons = ["0 8 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "waterlog-db"
database_id = "8b96aa01-ac65-4e49-a0d0-abc785d60c43"
migrations_dir = "../../migrations"

[[queues.producers]]
binding = "PATTERN_QUEUE"
queue = "waterlog-patterns"

[[queues.consumers]]
queue = "waterlog-patterns"
# One angler per message, so a slow one cannot take a batch of others down with it.
max_batch_size = 1
max_retries = 4

# The v2 engine's own queue (ADR-0017), producer and consumer, in the same Worker and separate from
# v1's. Sharing one queue would mean sharing a backlog and a retry budget, so a slow v2 run would
# delay a v1 recompute — the same argument that made v1 one angler per message, one level up.
#
# `wrangler deploy` will not create it:
#   wrangler queues create pattern-engine
[[queues.producers]]
binding = "ENGINE_QUEUE"
queue = "pattern-engine"

[[queues.consumers]]
queue = "pattern-engine"
max_batch_size = 1
max_retries = 4

[limits]
# v2 runs to completion in one invocation instead of chunking against a budget: the brief measured
# ~60ms at 40 trips and ~210ms at 300, so five seconds is more than an order of magnitude of
# headroom. It is a backstop against a pathological history, not a working limit — if a real angler
# ever approaches it, the run log's trip and hour counts say who and how much.
cpu_ms = 5_000

[vars]
# Where a push notification's link lands — the Pages origin the browser knows, never this Worker's
# own hostname.
APP_URL = "https://waterlog-web.pages.dev"
#
# The engine cutover (ADR-0017). "v1" keeps the shipped feed on the v1 engine and runs v2 in
# shadow, writing only its own tables. "v2" hands the feed to the v2 engine: it projects onto
# `pattern_cache` through the adapter, claims `pattern_runs.completed_at`, owns the first-pattern
# push, and the nightly sweep stops enqueueing v1 altogether.
#
# It is one word here, rather than a code change, so that turning v2 on and taking it back off are
# the same size of edit — a one-line commit that CI deploys. Anything but the exact string "v2"
# leaves v1 in charge, so a typo fails safe.
#
# Flip this when the parity gate has been reviewed against real fishing:
#   curl "http://127.0.0.1:8799/__parity?user=<id>"   (see CLAUDE.md)
PATTERN_ENGINE_VERSION = "v2"
#
# VAPID keys deliberately do NOT appear here. The private key signs push authentication tokens for
# this origin; every environment that loads this file is a deployed one. Set them as secrets:
#   wrangler secret put VAPID_PUBLIC_KEY
#   wrangler secret put VAPID_PRIVATE_KEY
#   wrangler secret put VAPID_SUBJECT
# Without them the recompute still runs and the first-pattern push is skipped, leaving the
# once-ever flag unclaimed so the announcement survives until the keys are configured.
